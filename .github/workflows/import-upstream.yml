name: Import upstream project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy project
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/mir-ashiq/canvix.git /tmp/upstream
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/upstream/ "$GITHUB_WORKSPACE/"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("package.json")
          data = json.loads(p.read_text())
          data["name"] = "editospace"
          data["description"] = "EditoSpace — professional graphic design and poster creation studio."
          p.write_text(json.dumps(data, indent=2) + "\n")
          p = Path("README.md")
          s = p.read_text().replace("# Canvix", "# EditoSpace", 1)
          s = s.replace("Canvix is a browser-based design tool", "EditoSpace is a browser-based design tool", 1)
          s = s.replace("https://github.com/mir-ashiq/canvix", "https://github.com/luckyfoundertech-alt/EditoSpace")
          header = """<div align="center">

          # EditoSpace

          **Professional design. Your creative space.**

          Maintained by **Lucky Dubey**.

          Based on the MIT-licensed Canvix open-source project. Original copyright and license notices remain in LICENSE.

          </div>

          ---

          """
          p.write_text(header + s.replace("# EditoSpace", "", 1))
          PY
          git config user.name "Lucky Dubey"
          git config user.email "361022441+luckyfoundertech-alt@users.noreply.github.com"
          git add -A
          git commit -m "Import complete project as EditoSpace"
          git push
